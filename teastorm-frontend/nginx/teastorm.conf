# =============================================================================
# TeaStorm — NGINX Reverse Proxy Configuration
#
# Install:
#   sudo cp nginx/teastorm.conf /etc/nginx/sites-available/teastorm
#   sudo ln -s /etc/nginx/sites-available/teastorm /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then run Certbot for HTTPS:
#   sudo certbot --nginx -d teastorm.com -d www.teastorm.com
# =============================================================================

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name teastorm.com www.teastorm.com;

    # Let Certbot manage ACME challenges for SSL renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    server_name teastorm.com www.teastorm.com;

    # --- SSL (Certbot will fill these in) ------------------------------------
    # ssl_certificate     /etc/letsencrypt/live/teastorm.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/teastorm.com/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # --- Gzip ----------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # --- Security headers ----------------------------------------------------
    add_header X-Frame-Options           "SAMEORIGIN"            always;
    add_header X-Content-Type-Options    "nosniff"               always;
    add_header X-XSS-Protection          "1; mode=block"         always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- Client body limit (prevent oversized checkout payloads) -------------
    client_max_body_size 2m;

    # --- Stripe webhook: pass raw body untouched -----------------------------
    location /api/checkout/stripe/webhook {
        proxy_pass         http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Do NOT buffer — Stripe signature depends on the raw body
        proxy_request_buffering off;
    }

    # --- Static Next.js assets — long-lived cache ----------------------------
    location /_next/static/ {
        proxy_pass         http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        expires            1y;
        add_header         Cache-Control "public, immutable";
        access_log         off;
    }

    # --- Public folder assets ------------------------------------------------
    location /images/ {
        proxy_pass         http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        expires            30d;
        add_header         Cache-Control "public";
        access_log         off;
    }

    # --- All other requests → Next.js app ------------------------------------
    location / {
        proxy_pass         http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
